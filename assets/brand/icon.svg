<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Stashly — stash &amp; cache">
  <defs>
    <linearGradient id="st-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1116"/>
      <stop offset="1" stop-color="#090a0c"/>
    </linearGradient>
    <linearGradient id="st-bottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b1d6e"/>
      <stop offset="1" stop-color="#1a0d33"/>
    </linearGradient>
    <linearGradient id="st-middle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d3fd0"/>
      <stop offset="1" stop-color="#3b1d6e"/>
    </linearGradient>
    <linearGradient id="st-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6d3fd0"/>
    </linearGradient>
    <linearGradient id="st-lock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ebab5"/>
      <stop offset="1" stop-color="#3a8d87"/>
    </linearGradient>
    <radialGradient id="st-glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="st-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#st-bg)"/>
  <circle cx="256" cy="256" r="220" fill="url(#st-glow)"/>

  <!-- stacked platters -->
  <g filter="url(#st-shadow)">
    <!-- bottom layer -->
    <polygon points="118,332 256,388 394,332 394,372 256,428 118,372"
             fill="url(#st-bottom)" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1.5"/>
    <!-- middle layer -->
    <polygon points="118,260 256,316 394,260 394,300 256,356 118,300"
             fill="url(#st-middle)" stroke="#8b5cf6" stroke-opacity="0.55" stroke-width="1.5"/>
    <!-- top layer -->
    <polygon points="118,188 256,244 394,188 394,228 256,284 118,228"
             fill="url(#st-top)" stroke="#c4b5fd" stroke-opacity="0.7" stroke-width="1.5"/>
  </g>

  <!-- top layer highlight strip -->
  <polygon points="118,188 256,244 394,188 256,212" fill="#c4b5fd" fill-opacity="0.18"/>

  <!-- center lock -->
  <g transform="translate(256 256)">
    <!-- shackle -->
    <path d="M -28 -10 A 28 28 0 0 1 28 -10 L 28 8 L 14 8 L 14 -10 A 14 14 0 0 0 -14 -10 L -14 8 L -28 8 Z"
          fill="url(#st-lock)" stroke="#7ebab5" stroke-width="1"/>
    <!-- body -->
    <rect x="-32" y="6" width="64" height="44" rx="6" fill="url(#st-lock)" stroke="#7ebab5" stroke-width="1.5"/>
    <!-- keyhole -->
    <circle cx="0" cy="24" r="5" fill="#090a0c"/>
    <rect x="-2" y="24" width="4" height="14" fill="#090a0c"/>
  </g>

  <!-- sparkles -->
  <g fill="#7ebab5" opacity="0.7">
    <polygon points="100,120 104,128 112,132 104,136 100,144 96,136 88,132 96,128"/>
    <polygon points="412,150 415,156 421,159 415,162 412,168 409,162 403,159 409,156" opacity="0.6"/>
    <polygon points="420,380 423,386 429,389 423,392 420,398 417,392 411,389 417,386" opacity="0.5"/>
  </g>
</svg>
